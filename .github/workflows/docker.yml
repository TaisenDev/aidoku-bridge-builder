name: Build + push bridge image

# Public image ships the marker-slot wasm; each deployment patches its own
# config at container startup. Safe to distribute.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/taisendev/aidoku-bridge-builder

jobs:
  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build + push (arm64 native; amd64 via QEMU)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push restricted Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:caddy-${{ env.VERSION }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Smoke test startup patch
        run: |
          set -euo pipefail
          name=bridge-smoke-${GITHUB_RUN_ID}
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" --platform linux/arm64 \
            -e STATIC_URL=https://aidoku.example.com \
            -e API_URL=https://aidoku.example.com/api \
            -e TOKEN=smoke-test-token-0123456789abcdef0123456789 \
            -e GATEWAY_TOKEN=smoke-test-token-0123456789abcdef0123456789 \
            -e POLL_SECONDS=3600 \
            ${{ env.IMAGE }}:${{ env.VERSION }} >/dev/null
          for attempt in $(seq 1 20); do
            logs="$(docker logs "$name" 2>&1 || true)"
            if grep -q "patched deployment wasm (api=https://aidoku.example.com/api, token=set)" <<<"$logs"; then
              echo "startup patch OK"
              exit 0
            fi
            sleep 1
          done
          docker logs "$name"
          echo "startup patch marker not found" >&2
          exit 1
