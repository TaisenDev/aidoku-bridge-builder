name: Bridge CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GraphQL parser
        run: python -m pip install "graphql-core>=3.2,<4"
      - name: Check Python syntax
        run: python -m py_compile builder.py gateway.py tests/test_gateway.py
      - name: Test gateway allowlist
        run: python -m unittest discover -s tests -v

  build-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: aidoku-bridge-builder:ci
